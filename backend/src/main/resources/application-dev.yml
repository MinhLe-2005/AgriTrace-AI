spring:
  config:
    activate:
      on-profile: dev
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:my_fullstack_app}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
  flyway:
    enabled: false
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
management:
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false
logging:
  level:
    com.example.myfullstackapp: DEBUG
app:
  demo:
    trace-samples: true
  jwt:
    secret: "dev-secret-key-must-be-at-least-32-characters-long-123456"
