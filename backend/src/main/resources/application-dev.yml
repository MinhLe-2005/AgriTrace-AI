spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${POSTGRES_DB:my_fullstack_app}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:admin}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:admin}}
  jpa:
    show-sql: true
logging:
  level:
    com.example.myfullstackapp: DEBUG
app:
  jwt:
    secret: "dev-secret-key-must-be-at-least-32-characters-long-123456"
