spring:
  config:
    activate:
      on-profile: dev
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:aws-0-ap-northeast-1.pooler.supabase.com}:${DB_PORT:6543}/${POSTGRES_DB:postgres}?sslmode=require&prepareThreshold=0}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres.apbwidlapzntxdpjsnen}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:Bimdiendie1@}}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
  flyway:
    enabled: false
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
management:
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false
logging:
  level:
    com.example.myfullstackapp: DEBUG
app:
  jwt:
    secret: "dev-secret-key-must-be-at-least-32-characters-long-123456"
